[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openclaw-apple-bridge"
version = "0.1.0"
description = "Private JSON bridge between OpenClaw and Apple account services."
requires-python = ">=3.11"
dependencies = [
  "pyicloud>=2.6.5,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.12,<1",
  "mypy>=1.17,<2",
]

[project.scripts]
openclaw-apple-bridge = "openclaw_apple_bridge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
